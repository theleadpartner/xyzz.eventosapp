name: Apply mobile advanced QR rc24 bundle

on:
  push:
    branches:
      - feature/mobile-advanced-qr-offline-rc24
    paths:
      - .eventosapp-patch/**
      - .github/workflows/apply-mobile-advanced-qr-rc24.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mobile-advanced-qr-offline-rc24
          fetch-depth: 0

      - name: Rebuild exact patch bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .eventosapp-patch/chunk-*.b64 | base64 --decode > /tmp/eventosapp-backend.tgz
          tar -xzf /tmp/eventosapp-backend.tgz -C .

      - name: Validate PHP
        shell: bash
        run: |
          set -euo pipefail
          php -l includes/api/eventosapp-mobile-advanced-qr-api.php
          php -l includes/api/eventosapp-mobile-event-offline-api.php
          php -l includes/api/eventosapp-mobile-kiosk-feature-permission.php

      - name: Commit exact backend changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "eventosapp-ci"
          git config user.email "eventosapp-ci@users.noreply.github.com"
          git add README.md \
            includes/api/eventosapp-mobile-advanced-qr-api.php \
            includes/api/eventosapp-mobile-event-offline-api.php \
            includes/api/eventosapp-mobile-kiosk-feature-permission.php
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: add advanced QR mobile API and offline package rc.24"
          git push origin HEAD:feature/mobile-advanced-qr-offline-rc24
