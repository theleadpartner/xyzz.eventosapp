name: PHP Lint

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-mobile-online:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint performance PHP
        run: |
          php -l includes/api/eventosapp-mobile-online-performance.php
          php -l includes/api/eventosapp-mobile-online-batch-index.php
          php -l includes/api/eventosapp-mobile-online-warm-coordinator.php
          php -l includes/api/eventosapp-mobile-kiosk-feature-permission.php
          php -l includes/admin/eventosapp-configuracion.php
          php -l includes/admin/eventosapp-herramientas.php
          php -l includes/admin/eventosapp-herramientas-core.php
          php -l includes/admin/eventosapp-herramientas-performance.php
          php -l includes/admin/eventosapp-herramientas-performance-data.php
          php -l includes/admin/eventosapp-herramientas-performance-assets.php
          php -l includes/admin/eventosapp-herramientas-performance-queue.php
          php -l includes/admin/eventosapp-herramientas-performance-controls.php

      - name: Verify Herramientas preservation
        run: |
          test "$(git hash-object includes/admin/eventosapp-herramientas-core.php)" = "85ec7013dd9d9c8a124adf364a52896c7606890d"
          grep -q "eventosapp-herramientas-core.php" includes/admin/eventosapp-herramientas.php
          grep -q "eventosapp-herramientas-performance.php" includes/admin/eventosapp-herramientas.php
          test ! -e includes/admin/eventosapp-ticket-import-performance.php
