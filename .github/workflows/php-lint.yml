name: PHP Lint

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-mobile-online:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint mobile online PHP
        run: |
          php -l includes/api/eventosapp-mobile-online-performance.php
          php -l includes/api/eventosapp-mobile-online-warm-coordinator.php
          php -l includes/api/eventosapp-mobile-kiosk-feature-permission.php
